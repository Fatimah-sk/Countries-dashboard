      <script>
        try {
          const savedTheme = localStorage.getItem("countries-theme");

                document.documentElement.dataset.theme =
                  savedTheme === "dark" ? "dark" : "light";
              } catch {
                document.documentElement.dataset.theme = "light";
        }
    </script>
